<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BRAM Pattern Generator - PAL/NTSC Video IP</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Left panel ---- */
  #panel {
    width: 320px;
    min-width: 280px;
    background: #16213e;
    border-right: 2px solid #0f3460;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  #panel-header {
    background: #0f3460;
    padding: 14px 16px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .5px;
    color: #e94560;
  }

  .section {
    padding: 12px 14px;
    border-bottom: 1px solid #0f3460;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #e94560;
    margin-bottom: 8px;
  }

  label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    margin-bottom: 6px;
    gap: 8px;
  }

  label span { flex: 0 0 auto; }

  input[type=number], select {
    flex: 1;
    background: #0a1628;
    border: 1px solid #0f3460;
    color: #e0e0e0;
    padding: 4px 7px;
    border-radius: 4px;
    font-size: 12.5px;
    min-width: 0;
  }

  input[type=range] {
    flex: 1;
    accent-color: #e94560;
  }

  input[type=color] {
    flex: 0 0 40px;
    height: 24px;
    border: 1px solid #0f3460;
    border-radius: 4px;
    cursor: pointer;
    background: none;
    padding: 1px;
  }

  input[type=checkbox] { accent-color: #e94560; width: 14px; height: 14px; }

  .btn {
    display: block;
    width: 100%;
    padding: 9px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-secondary { background: #0f3460; color: #e0e0e0; }
  .btn-export  { background: #533483; color: #fff; }
  .btn-bin     { background: #1d6b44; color: #fff; }

  /* stripe zone rows */
  #zone-list { display: flex; flex-direction: column; gap: 4px; }
  .zone-row {
    display: flex; align-items: center; gap: 6px;
    background: #0a1628; border-radius: 4px; padding: 4px 7px;
    font-size: 12px;
  }
  .zone-row input[type=number] { width: 52px; flex: none; }
  .zone-row span { flex: 1; font-size: 11px; color: #aaa; }

  /* ---- Right: canvas area ---- */
  #canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    overflow: hidden;
    gap: 10px;
  }

  #canvas-wrap {
    position: relative;
    border: 2px solid #0f3460;
    background: #000;
    display: inline-block;
    max-width: 95vw;
    max-height: 85vh;
    overflow: hidden;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  #overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  #info-bar {
    font-size: 11px;
    color: #888;
    text-align: center;
  }

  /* hidden sections */
  .hidden { display: none !important; }

  /* value display beside range */
  .range-val { font-size: 11px; color: #e94560; min-width: 28px; text-align: right; }
</style>
</head>
<body>

<!-- ===== Left panel ===== -->
<div id="panel">
  <div id="panel-header">&#9654; BRAM Pattern Generator</div>

  <!-- Canvas size -->
  <div class="section">
    <div class="section-title">Canvas Size</div>
    <label><span>Width px</span>
      <input type="number" id="cvs-w" value="520" min="1" max="1920"></label>
    <label><span>Height px</span>
      <input type="number" id="cvs-h" value="576" min="1" max="1080"></label>
    <label><span>Format</span>
      <select id="fmt-preset">
        <option value="">Custom</option>
        <option value="520,576" selected>PAL 625/50 (520x576)</option>
        <option value="520,480">NTSC 525/60 (520x480)</option>
        <option value="640,480">VGA 640x480</option>
        <option value="320,240">QVGA 320x240</option>
      </select>
    </label>
    <label><span>PAL overlay</span>
      <input type="checkbox" id="pal-overlay" checked>
    </label>
  </div>

  <!-- Pattern type -->
  <div class="section">
    <div class="section-title">Pattern</div>
    <label><span>Type</span>
      <select id="pat-type">
        <option value="solid_white">Solid White</option>
        <option value="solid_black">Solid Black</option>
        <option value="v_stripes" selected>Vertical Stripes</option>
        <option value="h_stripes">Horizontal Stripes</option>
        <option value="checkerboard">Checkerboard</option>
        <option value="v_gradient">V-Gradient (H steps)</option>
        <option value="h_gradient">H-Gradient (V steps)</option>
        <option value="crosshatch">Crosshatch Grid</option>
        <option value="centre_cross">Centre Cross</option>
        <option value="circle">Circle / Ellipse</option>
        <option value="zones">Custom Zones (V)</option>
      </select>
    </label>
    <label><span>Foreground</span>
      <input type="color" id="col-fg" value="#ffffff"></label>
    <label><span>Background</span>
      <input type="color" id="col-bg" value="#000000"></label>
  </div>

  <!-- Pattern-specific controls -->
  <div class="section" id="sec-stripes">
    <div class="section-title">Stripe Options</div>
    <label><span>Stripe width</span>
      <input type="number" id="stripe-w" value="4" min="1" max="1024">
    </label>
  </div>

  <div class="section hidden" id="sec-checker">
    <div class="section-title">Checkerboard</div>
    <label><span>Cell width</span>
      <input type="number" id="check-w" value="52" min="1" max="512"></label>
    <label><span>Cell height</span>
      <input type="number" id="check-h" value="58" min="1" max="512"></label>
  </div>

  <div class="section hidden" id="sec-gradient">
    <div class="section-title">Gradient</div>
    <label><span>Steps</span>
      <input type="number" id="grad-steps" value="10" min="2" max="256"></label>
  </div>

  <div class="section hidden" id="sec-crosshatch">
    <div class="section-title">Crosshatch</div>
    <label><span>H spacing px</span>
      <input type="number" id="cross-h" value="52" min="1" max="1024"></label>
    <label><span>V spacing px</span>
      <input type="number" id="cross-v" value="58" min="1" max="1024"></label>
    <label><span>Line width px</span>
      <input type="number" id="cross-lw" value="1" min="1" max="16"></label>
  </div>

  <div class="section hidden" id="sec-circle">
    <div class="section-title">Circle / Ellipse</div>
    <label><span>Centre X</span>
      <input type="number" id="circ-cx" value="260" min="0" max="1920"></label>
    <label><span>Centre Y</span>
      <input type="number" id="circ-cy" value="288" min="0" max="1080"></label>
    <label><span>Radius X</span>
      <input type="number" id="circ-rx" value="150" min="1" max="1920"></label>
    <label><span>Radius Y</span>
      <input type="number" id="circ-ry" value="150" min="1" max="1080"></label>
    <label><span>Fill</span>
      <input type="checkbox" id="circ-fill" checked></label>
  </div>

  <div class="section hidden" id="sec-zones">
    <div class="section-title">Custom Zones (Vertical)</div>
    <label><span>Zone count</span>
      <input type="number" id="zone-count" value="8" min="1" max="32"></label>
    <button class="btn btn-secondary" id="btn-gen-zones" style="margin-bottom:8px">Regenerate Zone List</button>
    <div id="zone-list"></div>
    <p style="font-size:11px;color:#888;margin-top:6px">Width auto-fills to share remaining pixels evenly.</p>
  </div>

  <!-- Brightness slider -->
  <div class="section">
    <div class="section-title">Output Level</div>
    <label>
      <span>Brightness</span>
      <input type="range" id="brightness" min="0" max="255" value="255">
      <span class="range-val" id="brightness-val">255</span>
    </label>
    <label>
      <span>Threshold (1-bit)</span>
      <input type="range" id="threshold" min="0" max="255" value="128">
      <span class="range-val" id="threshold-val">128</span>
    </label>
  </div>

  <!-- Export buttons -->
  <div class="section">
    <div class="section-title">Export</div>
    <button class="btn btn-export" id="btn-png">Save as PNG</button>
    <button class="btn btn-bin"    id="btn-bin">Save 1-bit Binary (BRAM)</button>
    <button class="btn btn-secondary" id="btn-copy-vhd">Copy as VHDL init string</button>
    <p id="export-info" style="font-size:11px;color:#888;margin-top:8px"></p>
  </div>
</div>

<!-- ===== Right: canvas ===== -->
<div id="canvas-area">
  <div id="canvas-wrap">
    <canvas id="main-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>
  <div id="info-bar">Hover over canvas to see pixel info</div>
</div>

<script>
// ============================================================
// State
// ============================================================
const $ = id => document.getElementById(id);
const cvs   = $('main-canvas');
const octx  = $('overlay-canvas');
const ctx   = cvs.getContext('2d');
const ovCtx = octx.getContext('2d');

// ============================================================
// Utilities
// ============================================================
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function lerp(a,b,t) { return Math.round(a + (b-a)*t); }

function lerpColor(c1, c2, t) {
  return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
}

function drawPalOverlay(w, h) {
  ovCtx.clearRect(0,0,w,h);
  if (!$('pal-overlay').checked) return;
  ovCtx.strokeStyle = 'rgba(255,80,80,0.55)';
  ovCtx.lineWidth = 1;
  ovCtx.setLineDash([4,3]);
  // centre cross
  ovCtx.beginPath();
  ovCtx.moveTo(w/2, 0); ovCtx.lineTo(w/2, h);
  ovCtx.moveTo(0, h/2); ovCtx.lineTo(w, h/2);
  ovCtx.stroke();
  // corner markers
  const m = 20;
  ovCtx.setLineDash([]);
  ovCtx.strokeStyle = 'rgba(255,80,80,0.7)';
  [[0,0],[w,0],[0,h],[w,h]].forEach(([x,y]) => {
    const sx = x===0?1:-1, sy = y===0?1:-1;
    ovCtx.beginPath();
    ovCtx.moveTo(x,y+sy*m); ovCtx.lineTo(x,y); ovCtx.lineTo(x+sx*m,y);
    ovCtx.stroke();
  });
}

// ============================================================
// Pattern renderers — each fills imageData.data (RGBA)
// ============================================================
function fillPattern(imgData, w, h) {
  const d  = imgData.data;
  const fg = hexToRgb($('col-fg').value);
  const bg = hexToRgb($('col-bg').value);
  const bri = +$('brightness').value / 255;
  const pat = $('pat-type').value;

  function setPixel(x,y,c) {
    const i = (y*w+x)*4;
    d[i]   = Math.round(c[0]*bri);
    d[i+1] = Math.round(c[1]*bri);
    d[i+2] = Math.round(c[2]*bri);
    d[i+3] = 255;
  }

  function isFg(x,y) {
    switch(pat) {
      case 'solid_white':  return true;
      case 'solid_black':  return false;
      case 'v_stripes': {
        const sw = +$('stripe-w').value;
        return Math.floor(x/sw) % 2 === 0;
      }
      case 'h_stripes': {
        const sw = +$('stripe-w').value;
        return Math.floor(y/sw) % 2 === 0;
      }
      case 'checkerboard': {
        const cw = +$('check-w').value;
        const ch = +$('check-h').value;
        return (Math.floor(x/cw) + Math.floor(y/ch)) % 2 === 0;
      }
      case 'v_gradient': {
        const steps = +$('grad-steps').value;
        const sw = w / steps;
        const t = Math.min(Math.floor(x/sw), steps-1) / (steps-1);
        return t; // return number 0..1 for gradient
      }
      case 'h_gradient': {
        const steps = +$('grad-steps').value;
        const sh = h / steps;
        const t = Math.min(Math.floor(y/sh), steps-1) / (steps-1);
        return t;
      }
      case 'crosshatch': {
        const ch = +$('cross-h').value;
        const cv = +$('cross-v').value;
        const lw = +$('cross-lw').value;
        return (x % ch) < lw || (y % cv) < lw;
      }
      case 'centre_cross': {
        return x === Math.floor(w/2) || y === Math.floor(h/2);
      }
      case 'circle': {
        const cx = +$('circ-cx').value;
        const cy = +$('circ-cy').value;
        const rx = +$('circ-rx').value;
        const ry = +$('circ-ry').value;
        const fill = $('circ-fill').checked;
        const d2 = ((x-cx)/rx)**2 + ((y-cy)/ry)**2;
        if (fill) return d2 <= 1;
        return Math.abs(d2-1) < 2/Math.min(rx,ry);
      }
      case 'zones': {
        return getZoneColor(x, w); // returns color directly
      }
      default: return false;
    }
  }

  if (pat === 'v_gradient' || pat === 'h_gradient') {
    for (let y=0; y<h; y++) {
      for (let x=0; x<w; x++) {
        const t = isFg(x,y);
        setPixel(x, y, lerpColor(bg, fg, t));
      }
    }
    return;
  }

  if (pat === 'zones') {
    const zones = getZones();
    let xpos = 0;
    for (const z of zones) {
      const c = hexToRgb(z.color);
      const xe = Math.min(xpos + z.width, w);
      for (let y=0; y<h; y++) {
        for (let x=xpos; x<xe; x++) {
          setPixel(x, y, c.map(v=>Math.round(v*bri)));
        }
      }
      xpos = xe;
    }
    // fill any remainder
    for (let y=0; y<h; y++) {
      for (let x=xpos; x<w; x++) {
        setPixel(x, y, bg);
      }
    }
    return;
  }

  for (let y=0; y<h; y++) {
    for (let x=0; x<w; x++) {
      setPixel(x, y, isFg(x,y) ? fg : bg);
    }
  }
}

// ============================================================
// Zone list management
// ============================================================
const ZONE_COLORS = [
  '#ffffff','#aaaaaa','#777777','#444444',
  '#ffffff','#888888','#333333','#000000',
  '#cccccc','#555555','#222222','#eeeeee',
  '#bbbbbb','#666666','#111111','#dddddd',
  '#999999','#0f0f0f','#f0f0f0','#505050',
  '#303030','#c0c0c0','#707070','#e0e0e0',
  '#404040','#b0b0b0','#808080','#202020',
  '#909090','#101010','#f8f8f8','#080808',
];

function buildZoneList() {
  const count = Math.max(1, Math.min(32, +$('zone-count').value));
  const w = +$('cvs-w').value;
  const defW = Math.floor(w / count);
  const list = $('zone-list');
  list.innerHTML = '';
  for (let i=0; i<count; i++) {
    const row = document.createElement('div');
    row.className = 'zone-row';
    row.innerHTML = `
      <input type="color" class="z-col" value="${ZONE_COLORS[i % ZONE_COLORS.length]}">
      <span>Zone ${i+1}</span>
      <input type="number" class="z-w" value="${defW}" min="1" max="1920">
    `;
    list.appendChild(row);
  }
  addZoneListeners();
}

function addZoneListeners() {
  $('zone-list').querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', render);
  });
}

function getZones() {
  const rows = $('zone-list').querySelectorAll('.zone-row');
  return Array.from(rows).map(r => ({
    color: r.querySelector('.z-col').value,
    width: Math.max(1, +r.querySelector('.z-w').value),
  }));
}

function getZoneColor(x, w) { return false; } // unused (handled above)

// ============================================================
// Main render
// ============================================================
function render() {
  const w = Math.max(1, Math.min(1920, +$('cvs-w').value));
  const h = Math.max(1, Math.min(1080, +$('cvs-h').value));

  cvs.width  = w;
  cvs.height = h;
  octx.width  = w;
  octx.height = h;

  // Scale canvas to fit the viewport
  const wrap = document.getElementById('canvas-wrap');
  const maxW = wrap.parentElement.clientWidth  - 20;
  const maxH = wrap.parentElement.clientHeight - 60;
  const scale = Math.min(1, maxW/w, maxH/h);
  cvs.style.width  = Math.round(w*scale)+'px';
  cvs.style.height = Math.round(h*scale)+'px';
  octx.style.width  = cvs.style.width;
  octx.style.height = cvs.style.height;

  const imgData = ctx.createImageData(w, h);
  fillPattern(imgData, w, h);
  ctx.putImageData(imgData, 0, 0);

  drawPalOverlay(w, h);
  updateInfo(w, h);
}

function updateInfo(w,h) {
  const bits = w * h;
  const bytes = Math.ceil(bits/8);
  $('info-bar').textContent =
    `${w} x ${h}  |  ${bits.toLocaleString()} px  |  BRAM: ${bytes.toLocaleString()} bytes  (${(bytes/1024).toFixed(1)} KB)`;
  $('export-info').textContent =
    `1-bit binary: ${bytes.toLocaleString()} bytes (MSB-first row order, 520-px stride)`;
}

// ============================================================
// Section visibility
// ============================================================
const SEC_MAP = {
  solid_white:   [],
  solid_black:   [],
  v_stripes:     ['sec-stripes'],
  h_stripes:     ['sec-stripes'],
  checkerboard:  ['sec-checker'],
  v_gradient:    ['sec-gradient'],
  h_gradient:    ['sec-gradient'],
  crosshatch:    ['sec-crosshatch'],
  centre_cross:  [],
  circle:        ['sec-circle'],
  zones:         ['sec-zones'],
};

function updateSections() {
  const all = ['sec-stripes','sec-checker','sec-gradient','sec-crosshatch','sec-circle','sec-zones'];
  const pat = $('pat-type').value;
  all.forEach(id => $(id).classList.add('hidden'));
  (SEC_MAP[pat]||[]).forEach(id => $(id).classList.remove('hidden'));
  render();
}

// ============================================================
// Export: PNG
// ============================================================
$('btn-png').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href     = cvs.toDataURL('image/png');
  a.download = `bram_pattern_${cvs.width}x${cvs.height}.png`;
  a.click();
});

// ============================================================
// Export: 1-bit binary (MSB-first, row stride = canvas width)
// ============================================================
$('btn-bin').addEventListener('click', () => {
  const w = cvs.width, h = cvs.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const thr = +$('threshold').value;
  const rowBytes = Math.ceil(w/8);
  const buf = new Uint8Array(rowBytes * h);

  for (let y=0; y<h; y++) {
    for (let x=0; x<w; x++) {
      const i = (y*w+x)*4;
      const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if (lum >= thr) {
        const bi = y*rowBytes + Math.floor(x/8);
        buf[bi] |= (0x80 >> (x%8));
      }
    }
  }

  const blob = new Blob([buf], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `bram_pattern_${w}x${h}.bin`;
  a.click();
});

// ============================================================
// Export: VHDL init string snippet (first 64 bytes as hex comment)
// ============================================================
$('btn-copy-vhd').addEventListener('click', () => {
  const w = cvs.width, h = cvs.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const thr = +$('threshold').value;
  const rowBytes = Math.ceil(w/8);
  const total = rowBytes * h;
  const buf = new Uint8Array(total);

  for (let y=0; y<h; y++) {
    for (let x=0; x<w; x++) {
      const i = (y*w+x)*4;
      const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      if (lum >= thr) {
        const bi = y*rowBytes + Math.floor(x/8);
        buf[bi] |= (0x80 >> (x%8));
      }
    }
  }

  // Build a VHDL comment + array constant snippet
  const preview = Array.from(buf.slice(0,64))
    .map(b => b.toString(16).padStart(2,'0').toUpperCase())
    .join(' ');

  const vhd = [
    `-- BRAM Pattern: ${w}x${h} px,  ${total} bytes`,
    `-- Generated by bram_pattern_gen.html`,
    `-- First 64 bytes (hex, MSB-first): ${preview}${total>64?' ...':''}`,
    `-- Load with bram_wr_en pulse loop or $readmemh.`,
    ``,
    `-- To load via simulation:`,
    `--   use std.textio.all;`,
    `--   file f : text open read_mode is "bram_pattern_${w}x${h}.bin";`,
    `--   (see project scripts for binary-to-BRAM helper)`,
  ].join('\n');

  navigator.clipboard.writeText(vhd).then(() => {
    $('export-info').textContent = 'VHDL snippet copied to clipboard!';
    setTimeout(() => updateInfo(w,h), 2000);
  });
});

// ============================================================
// Wire up all controls
// ============================================================
['cvs-w','cvs-h','col-fg','col-bg',
 'stripe-w','check-w','check-h','grad-steps',
 'cross-h','cross-v','cross-lw',
 'circ-cx','circ-cy','circ-rx','circ-ry',
 'zone-count',
].forEach(id => $(id)?.addEventListener('input', render));

['circ-fill','pal-overlay'].forEach(id =>
  $(id)?.addEventListener('change', render)
);

$('pat-type').addEventListener('change', updateSections);

$('brightness').addEventListener('input', () => {
  $('brightness-val').textContent = $('brightness').value;
  render();
});
$('threshold').addEventListener('input', () => {
  $('threshold-val').textContent = $('threshold').value;
});

$('fmt-preset').addEventListener('change', () => {
  const v = $('fmt-preset').value;
  if (!v) return;
  const [w,h] = v.split(',').map(Number);
  $('cvs-w').value = w;
  $('cvs-h').value = h;
  $('circ-cx').value = Math.floor(w/2);
  $('circ-cy').value = Math.floor(h/2);
  render();
});

$('btn-gen-zones').addEventListener('click', () => {
  buildZoneList();
  render();
});

// hover pixel info
document.getElementById('canvas-wrap').addEventListener('mousemove', e => {
  const rect = cvs.getBoundingClientRect();
  const scaleX = cvs.width  / rect.width;
  const scaleY = cvs.height / rect.height;
  const mx = Math.floor((e.clientX - rect.left) * scaleX);
  const my = Math.floor((e.clientY - rect.top)  * scaleY);
  if (mx<0||my<0||mx>=cvs.width||my>=cvs.height) return;
  const px = ctx.getImageData(mx, my, 1, 1).data;
  const lum = Math.round(0.299*px[0]+0.587*px[1]+0.114*px[2]);
  $('info-bar').textContent =
    `x=${mx}  y=${my}  |  R=${px[0]} G=${px[1]} B=${px[2]}  |  ` +
    `Lum=${lum}  (BRAM bit: ${lum >= +$('threshold').value ? 1 : 0})  |  ` +
    `BRAM addr: ${my*cvs.width+mx}`;
});

// ============================================================
// Init
// ============================================================
buildZoneList();
updateSections();   // calls render()
</script>
</body>
</html>
